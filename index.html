<head></head>
<body>
    <center>
        <h1 style="color: green;">
            Group 6
        </h1>
        <h3>
            Please remember to click "submit" when finished:
        </h3>
        <form action="#" method="post">
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" 
                placeholder="Enter a secure password" pattern="^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&-+=()])(?=\\S+$).{8, 20}$"

            <input type="submit" value="Submit">
        </form>
    </center>
</body>
